<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRANA Air — Atmospheric Intelligence & Early Warning System</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="PRANA is a cross-border atmospheric intelligence platform forecasting airshed smoke trajectories, stubble burning plumes, and air corridor pollution across Punjab, Haryana, and Delhi NCR." />
    <meta name="keywords" content="air quality, AQI, atmospheric intelligence, stubble burning, crop residue, Delhi pollution, Punjab, plume forecast, CPCB, SensorThings" />
    <meta name="author" content="PRANA Air Quality Consortium" />
    <meta name="theme-color" content="#004AC6" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PRANA Air — Atmospheric Intelligence & Early Warning System" />
    <meta property="og:description" content="Real-time smoke plume trajectory forecasting, cross-border airshed analytics, and statutory incident dispatch for the Indo-Gangetic Plains." />
    <meta property="og:image" content="/vite.svg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PRANA Air — Atmospheric Intelligence & Early Warning System" />
    <meta name="twitter:description" content="Real-time smoke plume trajectory forecasting, cross-border airshed analytics, and statutory incident dispatch for the Indo-Gangetic Plains." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PRANA Air Quality Platform",
      "applicationCategory": "EnvironmentalMonitoringApplication",
      "operatingSystem": "All",
      "description": "Indo-Gangetic Airshed Intelligence & Early Warning System forecasting agricultural burning smoke corridors.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      }
    }
    </script>
    
    <!-- Google Fonts: Newsreader and Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Material Symbols Outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />

  <body class="bg-canvas-cream font-body-md text-ink-black min-h-screen relative selection:bg-primary selection:text-on-primary">
