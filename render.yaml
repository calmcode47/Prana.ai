services:
  - type: web
    name: prana-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: prana-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: FIRMS_MAP_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false

databases:
  - name: prana-db
    databaseName: prana
    user: prana
    plan: standard
    region: singapore
    postgresMajorVersion: "16"
