services:
  - type: web
    name: prana-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: 1c-2g
    numInstances: 1
    region: singapore
    healthCheckPath: /ready
    preDeployCommand: python -m backend.scripts.migrate_db
    autoDeploy: true
    envVars:
      - key: PRANA_ENV
        value: production
      - key: PRANA_DEMO_MODE
        value: "false"
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: prana-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: TTS_PROVIDER_KEY
        sync: false
      - key: TTS_PROVIDER_URL
        value: https://api.openai.com/v1/audio/speech
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: TTS_VOICE
        value: alloy

databases:
  - name: prana-db
    databaseName: prana
    user: prana
    plan: 1c-2g
    diskSizeGB: 10
    ipAllowList: []
    region: singapore
    postgresMajorVersion: "16"
