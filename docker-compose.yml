version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: prana_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prana}
      POSTGRES_USER: ${POSTGRES_USER:-prana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pranapass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prana} -d ${POSTGRES_DB:-prana}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prana_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prana_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prana}:${POSTGRES_PASSWORD:-pranapass}@db:5432/${POSTGRES_DB:-prana}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PORT: 8000
      HOST: 0.0.0.0
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - prana_net

volumes:
  postgres_data:
    driver: local

networks:
  prana_net:
    driver: bridge
