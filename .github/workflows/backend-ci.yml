name: PRANA Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'render.yaml'
      - 'railway.json'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'render.yaml'
      - 'railway.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  # ============================================================================
  # Job 1: Lint, AST Parsing & Code Quality Verification
  # ============================================================================
  lint-and-ast:
    name: Syntax & AST Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Compile Check (Zero Syntax Errors)
        run: |
          python -m py_compile $(find backend -name "*.py" -not -path "*/.venv/*")

      - name: AST Parse Verification
        run: |
          python -c "
          import os, ast, sys
          errs = []
          for root, _, files in os.walk('backend'):
              if '.venv' in root: continue
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8') as fh:
                          try:
                              ast.parse(fh.read(), filename=p)
                          except SyntaxError as e:
                              errs.append(f'{p}:{e.lineno}: {e.msg}')
          if errs:
              print('\n'.join(errs))
              sys.exit(1)
          print('All Python files parsed successfully with valid AST.')
          "

      - name: Flake8 Critical Error Scan
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=backend/.venv

  # ============================================================================
  # Job 2: Automated Unit, Integration & Load Regression Suite
  # ============================================================================
  test-suite:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: lint-and-ast
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: prana_test
          POSTGRES_USER: prana
          POSTGRES_PASSWORD: pranapass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock.txt

      - name: Verify PostGIS Migrations & Database Seeder
        env:
          DATABASE_URL: postgresql://prana:pranapass@localhost:5432/prana_test
          PYTHONPATH: .
        run: |
          python backend/scripts/seed_db.py --clean

      - name: Execute Backend Unit and PostGIS Regression Suite
        env:
          DATABASE_URL: postgresql://prana:pranapass@localhost:5432/prana_test
          PYTHONPATH: .
          PRANA_TEST_DATABASE_URL: postgresql://prana:pranapass@localhost:5432/prana_test
          PRANA_SCHEDULER_ENABLED: "false"
        run: |
          pytest backend/tests -m "not integration" --tb=short -v

      - name: Execute Concurrency & Latency Load Benchmark
        env:
          DATABASE_URL: postgresql://prana:pranapass@localhost:5432/prana_test
          PYTHONPATH: .
        run: |
          python backend/tests/load_test.py

      - name: Verify Production Mode over HTTPS and WSS
        env:
          PRANA_TEST_DATABASE_URL: postgresql://prana:pranapass@localhost:5432/prana_test
        run: python -m backend.scripts.verify_production_local

  # ============================================================================
  # Job 3: Docker Container Build & Runtime Healthcheck Validation
  # ============================================================================
  docker-build-and-verify:
    name: Docker Image Build & Health Check
    needs: test-suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: prana_test
          POSTGRES_USER: prana
          POSTGRES_PASSWORD: pranapass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: prana-backend:ci-test
          load: true

      - name: Run Container & Test Health Check
        run: |
          trap 'docker logs prana-test-container; docker rm -f prana-test-container' EXIT
          docker run -d --name prana-test-container --network host \
            -e DATABASE_URL=postgresql://prana:pranapass@localhost:5432/prana_test \
            -e PRANA_ENV=production -e PRANA_DEMO_MODE=false \
            -e PRANA_SCHEDULER_ENABLED=false -e CORS_ORIGINS=https://ci.invalid \
            prana-backend:ci-test
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8000/ready
          docker exec prana-test-container python -c 'import httpx; r=httpx.get("http://127.0.0.1:8000/ready"); r.raise_for_status(); d=r.json(); assert d["db"] == "connected" and d["demo_mode"] is False'
          docker exec prana-test-container python -m backend.scripts.verify_deployment --base-url http://127.0.0.1:8000 --local
